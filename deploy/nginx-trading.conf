# Copia in /etc/nginx/sites-available/trading e collega in sites-enabled.
# Il certificato SSL lo aggiunge Certbot (certbot --nginx -d trading.31cantaricrm.it).
server {
    listen 80;
    server_name trading.31cantaricrm.it;

    root /var/www/trading/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # "Ragiona ora" può richiedere qualche minuto
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
